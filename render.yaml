services:
  - type: web
    name: goot-resorts-demo
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd server && npm ci
    startCommand: cd server && node init-db.js && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: goot-resorts-demo-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false

databases:
  - name: goot-resorts-demo-db
    region: frankfurt
    plan: free
    databaseName: goot_demo
    user: goot_demo
